# The game's threads wait without spinning (src/thread_waits.cpp). These loops
# check a condition again and again; on the console that costs a hardware thread,
# here each one kept a host core busy (found with rewor_sample_file). Each hook
# lets the loop run as before and makes its checks cheap: a short spin, then
# short sleeps. rewor_wait_sleep_us = 0 turns them off. Same idea as
# GHVanHRecomp's thread_waits.cpp (MIT, Gustavo Garcia).

# The main thread waiting for the render thread to finish a frame:
# loc_8242AC14: lwz r11,24(r31); lwz r10,20(r31); cmplw cr6,r11,r10; beq (loop)
[[midasm_hook]]
address = 0x8242AC1C
name = "ReWorRenderWaitHook"
registers = ["r11", "r10"]

# The render thread waiting for the vertical blank counter (sub_8239FDC0) to
# reach the next value: loc_825841A8: bl; lwz r11,7404(r30); cmpld cr6,r3,r11; blt (loop)
[[midasm_hook]]
address = 0x825841B0
name = "ReWorVblankWaitHook"
registers = ["r3", "r11"]

# The same wait further down the render thread's frame:
# loc_825842F4: bl sub_8239FDD0; cmpld cr6,r3,r30; blt (loop)
[[midasm_hook]]
address = 0x825842F8
name = "ReWorVblankWait2Hook"
registers = ["r3", "r30"]

# The main thread at the start of its frame, calling sub_825528E0 until it
# returns 0: loc_8242C514: mr r3,r29; bl; cmplwi cr6,r3,0; bne (loop)
[[midasm_hook]]
address = 0x8242C51C
name = "ReWorFrameWaitHook"
registers = ["r3"]

# A check of a D3D wait for the GPU whose condition is still false (entry of
# sub_822D5D60, called by the library's six wait loops).
[[midasm_hook]]
address = 0x822D5D60
name = "ReWorGpuWaitHook"

# One frame of the game: the render thread's frame (sub_825840F0, which waits
# for the next vertical blank) runs once per frame the game draws. Counted for
# the FPS readout (F2), which otherwise follows the window's own repaints.
[[midasm_hook]]
address = 0x825840F0
name = "ReWorGuestFrameHook"

# The debug menu (src/notcd.cpp): NotCD, the C function the scripts ask before
# their developer-only parts (registered as "NotCD" at 0x8200B0FC in the table
# entry at 0x8280E284), returns whether the "on a disc" byte at 0x829A78FA is 0.
# With rewor_debug_menu it returns true; the byte itself, which CD reads too, is
# left as it is.
[[midasm_hook]]
address = 0x824FFCD8   # blr of sub_824FFCC8 (NotCD), r3 = its result
name = "ReWorNotCDHook"
registers = ["r3"]

# The debug menu, as the game's debug executable does it (src/notcd.cpp): the
# retail executable stores 1 in the "running from a disc" byte at 0x829A78FA in
# three places at boot; the debug one stores 0 there (and always reaches the
# first store), so the whole game believes it runs from a development PC.
# 0x824030FC beq -> nop, 0x82403100 / 0x824AD6A4 / 0x824FFB9C li r11,1 -> li r11,0.
[[midasm_hook]]
address = 0x824030F8   # cmplwi cr6,r10,0 (sub_82403098): nonzero = do not skip the store
name = "ReWorDiscFlagBranchHook"
registers = ["r10"]
[[midasm_hook]]
address = 0x82403104   # stb r11,30970(r29)
name = "ReWorDiscFlagStoreHook"
registers = ["r11"]
[[midasm_hook]]
address = 0x824AD6B4   # stb r11,30970(r10) (sub_824AD5E0)
name = "ReWorDiscFlagStoreHook"
registers = ["r11"]
[[midasm_hook]]
address = 0x824FFBA0   # stb r11,30970(r31) (sub_824FFAB0)
name = "ReWorDiscFlagStoreHook"
registers = ["r11"]

# The game's clock in time with the music (src/timer.cpp): the game replaces a
# reported timer frequency of 50,000,000 Hz by the console's real 49,875,000,
# and the SDK's timebase does run at 50,000,000, so the notes ran 0.25 % fast.
[[midasm_hook]]
address = 0x823A02D4   # cmplw cr6,r11,r7 (sub_823A0238): r7 = 50,000,000
name = "ReWorTimerFrequencyHook"
registers = ["r7"]

# Skipping the opening video (src/intro.cpp): PlayMovie (sub_8251DE38) answers
# "not started" for initial_boot_movie when rewor_skip_intro is on.
[[midasm_hook]]
address = 0x8251DE44   # mr r31,r3, after the prologue: r3 = the script's parameters
name = "ReWorPlayMovieHook"
registers = ["r3"]
jump_address_on_true = 0x8251DEA0   # li r3,0 and the function's return

