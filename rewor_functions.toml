# The game's threads wait without spinning (src/thread_waits.cpp). These loops
# check a condition again and again; on the console that costs a hardware thread,
# here each one kept a host core busy (found with rewor_sample_file). Each hook
# lets the loop run as before and makes its checks cheap: a short spin, then
# short sleeps. rewor_wait_sleep_us = 0 turns them off. Same idea as
# GHVanHRecomp's thread_waits.cpp (MIT, Gustavo Garcia).

# The main thread waiting for the render thread to finish a frame:
# loc_8242AC14: lwz r11,24(r31); lwz r10,20(r31); cmplw cr6,r11,r10; beq (loop)
[[midasm_hook]]
address = 0x8242AC1C
name = "ReWorRenderWaitHook"
registers = ["r11", "r10"]

# The render thread waiting for the vertical blank counter (sub_8239FDC0) to
# reach the next value: loc_825841A8: bl; lwz r11,7404(r30); cmpld cr6,r3,r11; blt (loop)
[[midasm_hook]]
address = 0x825841B0
name = "ReWorVblankWaitHook"
registers = ["r3", "r11"]

# A check of a D3D wait for the GPU whose condition is still false (entry of
# sub_822D5D60, called by the library's six wait loops).
[[midasm_hook]]
address = 0x822D5D60
name = "ReWorGpuWaitHook"

# One frame of the game: the render thread's frame (sub_825840F0, which waits
# for the next vertical blank) runs once per frame the game draws. Counted for
# the FPS readout (F2), which otherwise follows the window's own repaints.
[[midasm_hook]]
address = 0x825840F0
name = "ReWorGuestFrameHook"

# The debug menu (src/notcd.cpp): NotCD, the C function the scripts ask before
# their developer-only parts (registered as "NotCD" at 0x8200B0FC in the table
# entry at 0x8280E284), returns whether the "on a disc" byte at 0x829A78FA is 0.
# With rewor_debug_menu it returns true; the byte itself, which CD reads too, is
# left as it is.
[[midasm_hook]]
address = 0x824FFCD8   # blr of sub_824FFCC8 (NotCD), r3 = its result
name = "ReWorNotCDHook"
registers = ["r3"]
